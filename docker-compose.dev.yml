# Dev-stack-only override — layered on top of docker-compose.yml by deploy.sh
# whenever STACK_NAME=dev. The prod stack never loads this file, so it never gets
# the `agent-access` network at all (not even an unused copy of it).
#
# Adds the narrow bridge the devcontainer's `dev` service joins (as `external: true`,
# see .devcontainer/docker-compose.yml) to reach `backend`/`web` over HTTP only — `db`
# is deliberately left off this network, so it stays unreachable from the devcontainer.
services:
  backend:
    networks:
      - default
      - agent-access

  web:
    networks:
      - default
      - agent-access

  # Same source, same Dockerfile, same build — the only difference from `web` is the
  # baked VITE_API_BASE_URL. A browser running on the host resolves `web`'s baked
  # `http://localhost:8100`; a browser running inside the devcontainer (Playwright, via
  # `agent-access`) cannot — `localhost` there is the devcontainer itself, not this
  # stack. `backend:8000` is the container-DNS address, reachable because `backend`
  # is also on `agent-access`. No host port published — nothing off-container needs it.
  web-agent:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:8000
    image: aiacu-web-agent:dev
    depends_on:
      - backend
    networks:
      - agent-access

networks:
  agent-access:
    name: aiacu-agent-access-dev
