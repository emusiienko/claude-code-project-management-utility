# nginx serves the static React SPA on port 3000 (mapped to 127.0.0.1:3000).
# Single web entry; no API proxying — the browser calls the backend directly.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-API fallback: unknown paths resolve to index.html so client-
    # side routing (React Router) handles them instead of 404-ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; Vite emits content-hashed filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Lightweight liveness endpoint for the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
