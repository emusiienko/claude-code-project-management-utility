# Local Docker Compose stack for the AI Agent Coordination Utility.
#
# Single-machine, localhost-only. Every published port binds to 127.0.0.1 ONLY
# (never 0.0.0.0) — this port mapping IS the access boundary (there is no auth,
# by design; see docs/architecture.md § Authentication and docs/devops-strategy.md).
#
# Database selection is driven entirely by DATABASE_URL in .env:
#   - DEFAULT: PostgreSQL — the `postgres` profile is activated (by deploy.sh, or
#              `docker compose --profile postgres`) so the `db` container starts.
#   - OPT-IN:  SQLite (sqlite:///data/app.db) — no `db` container, no profile.
#
# Bring the stack up via ./deploy.sh (the single entry point), which selects the
# profile based on DATABASE_URL. For the Postgres default use
# `docker compose --profile postgres up`; a bare `docker compose up` works only
# after switching DATABASE_URL to the SQLite opt-in.
#
# CONCURRENT STACKS (STORY-024): every host-side port binding and both image tags
# are env-configurable so two checkouts can run at the same time from
# differently-named folders — a stable "prod" stack + the active "dev" stack. Only
# the HOST side of each port mapping is a variable — the container-internal ports
# stay fixed (8000/3000/5432), so inter-container networking and healthchecks are
# unchanged. Two committed env templates carry the two configs: `.env.example` is
# the "prod" stack (canonical ports, PostgreSQL default); `.env.dev.example` is the
# "dev" stack (offset ports, SQLite default). Copy the matching one to `.env` per
# checkout. See docs/devops-strategy.md § Running Two Stacks Concurrently.

services:
  # ---------------------------------------------------------------------------
  # backend — one Uvicorn process serving BOTH the REST API and the MCP server
  # (path-mounted at /mcp/v1) on a single port (:8000). See ADR-003 / ADR-032.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # STACK_NAME namespaces the image tag so the dev stack builds its own image
    # instead of overwriting the prod tag. Default (`prod`) is the stable stack.
    image: aiacu-backend:${STACK_NAME:-prod}
    env_file:
      - .env
    environment:
      # Defaults applied only when the variable is absent from .env. PostgreSQL is
      # the default dialect (the `db` container runs under the postgres profile,
      # which deploy.sh activates automatically). Switch to SQLite by editing .env;
      # its path then resolves to /app/backend/data/app.db, the sqlite_data volume
      # mount below.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/data/attachments}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # REST + MCP share this host port. localhost-only. Host side is BACKEND_PORT
      # (default 8000); the container port stays 8000. The dev stack sets a
      # different BACKEND_PORT (and matching VITE_API_BASE_URL — see .env.dev.example).
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # SQLite database file survives `down` (only removed by `down -v`).
      # Harmless when DATABASE_URL targets Postgres — the dir is just unused.
      - sqlite_data:/app/backend/data
      # Attachment files + version snapshots, outside any web root.
      - attachments:/data/attachments
    healthcheck:
      # The app exposes its OpenAPI schema under the /v1 prefix; a 200 here means
      # FastAPI has fully started and migrations (run in the entrypoint) completed.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
        # `required: false` lets backend start even when the db service is not
        # part of the active profile (i.e. the SQLite opt-in). When the
        # postgres profile is active (the default), the healthy condition is enforced.
        required: false
    networks:
      default: {}
      # Prod-stack bridge for OTHER projects' devcontainers (STORY-014). They join
      # it as `external: true`, name `aiacu-external-access`, and reach this
      # service at http://aiacu-backend:8000 — a project-unique alias, so it cannot
      # collide with another project's own `backend` service on the same network.
      # The dev stack strips this attachment (docker-compose.dev.yml), so only the
      # prod stack ever creates or joins the network.
      external-access:
        aliases:
          - aiacu-backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # web — nginx serving the static React (Vite) build. Single web entry.
  # The browser calls the backend directly at VITE_API_BASE_URL.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. The browser (not the container)
        # reaches the backend at this origin, so localhost:8000 is correct for
        # the local stack.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    # STACK_NAME namespaces the tag. The web image bakes VITE_API_BASE_URL at BUILD
    # time, so the dev stack MUST both set STACK_NAME (own image) and rebuild with a
    # matching VITE_API_BASE_URL, or its browser would call the wrong backend.
    image: aiacu-web:${STACK_NAME:-prod}
    ports:
      # Host side is WEB_PORT (default 3000); the container port stays 3000. A second
      # stack sets a different WEB_PORT (and matching CORS_ALLOWED_ORIGINS on backend).
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # db — PostgreSQL 18. The DEFAULT database. Started under the `postgres` profile,
  # which deploy.sh activates automatically because DATABASE_URL targets Postgres
  # out of the box. Switch DATABASE_URL to the SQLite opt-in to run without it.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # localhost-only; exposed for local inspection (psql) — not off-host. Host side
      # is POSTGRES_PORT (default 5432); the container port stays 5432. The internal
      # DATABASE_URL still targets db:5432 on the project network, so a second stack
      # only needs a different POSTGRES_PORT for its own external psql access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ changed the recommended layout: mount a single volume at
      # /var/lib/postgresql (NOT /var/lib/postgresql/data). The image then places
      # the data in a versioned subdirectory it manages itself. Mounting the old
      # /data path on an 18 image triggers the "unused mount/volume" warning.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  # SQLite database file (opt-in dialect). Survives `down`; removed by `down -v`.
  sqlite_data:
  # PostgreSQL data dir (only populated under the postgres profile).
  pg_data:
  # Attachment files + version snapshots.
  attachments:

networks:
  # Owned (created/removed) by this stack — NOT `external` here. Fixed `name:`, not
  # project-scoped, so other projects can reference it by a stable name across
  # down/up. `down` leaves it in place (with a "Resource is still in use" warning)
  # while another project's container is still attached. Only `backend` joins it —
  # `web` and `db` stay unreachable from other projects.
  external-access:
    name: aiacu-external-access
